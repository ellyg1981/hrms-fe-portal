server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    # Support React Router / BrowserRouter
    try_files $uri $uri/ /index.html;
  }

  # Cache static assets
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
